name: JANUS Adaptive UI Install One-Shot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/janus-adaptive-ui-install-one-shot.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply adaptive UI wiring
        run: python tools/apply-adaptive-ui.py
      - name: Validate responsive runtime
        run: |
          python -m pip install --quiet pytest
          node --check assets/adaptive-ui.js
          node --check assets/terminal-v2.js
          node --check assets/neural-link-v2.js
          python -m pytest -q tests/test_terminal_v2_static.py
          node tools/test-janus-observatory.js
      - name: Prove layout-only authority boundary
        run: |
          grep -Fq 'assets/adaptive-ui.css' index.html
          grep -Fq 'assets/adaptive-ui.js' index.html
          grep -Fq 'layout_only: true' assets/adaptive-ui.js
          grep -Fq 'command_authority: false' assets/adaptive-ui.js
          grep -Fq '100dvh' assets/adaptive-ui.css
          grep -Fq 'safe-area-inset-bottom' assets/adaptive-ui.css
          ! grep -Fq 'fetch(' assets/adaptive-ui.js
          ! grep -Fq 'GITHUB_TOKEN' assets/adaptive-ui.js
      - name: Persist adaptive UI wiring
        run: |
          git config user.name 'JANUS Adaptive UI'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html tests/test_terminal_v2_static.py tools/test-janus-observatory.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'JANUS Terminal: wire adaptive responsive interface'
          git pull --rebase origin main
          git push origin HEAD:main
