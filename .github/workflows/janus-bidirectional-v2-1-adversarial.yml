name: JANUS Bidirectional v2.1 Adversarial Negatives

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/janus_bidirectional_pulse_spiral_v2_1_1.py"
      - "tools/janus_bidirectional_v2_1_adversarial.py"
      - ".github/workflows/janus-bidirectional-v2-1-adversarial.yml"

permissions:
  contents: write

jobs:
  negative-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch runtime subjects
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/Hawkar-usls/aura-oracle-tg.git ../aura-oracle-tg
          git clone --depth 1 https://github.com/Hawkar-usls/Demi_Head.git ../Demi_Head
          git clone --depth 1 https://github.com/Hawkar-usls/Hawkar-usls.git ../Hawkar-usls-home
          git clone --depth 1 --branch janus/habitat https://github.com/Hawkar-usls/Janus_Genesis.git ../Janus_Genesis
      - name: Compile
        run: python -m py_compile tools/janus_bidirectional_pulse_spiral_v2_1.py tools/janus_bidirectional_pulse_spiral_v2_1_1.py tools/janus_bidirectional_v2_1_adversarial.py
      - name: Run expected-negative suite
        shell: bash
        run: |
          set -euo pipefail
          python tools/janus_bidirectional_v2_1_adversarial.py \
            --terminal . \
            --aura ../aura-oracle-tg \
            --demihead ../Demi_Head \
            --home ../Hawkar-usls-home \
            --habitat ../Janus_Genesis \
            -o receipts/JANUS_BIDIRECTIONAL_V2_1_ADVERSARIAL_LATEST.json
      - name: Verify expected negatives
        shell: bash
        run: |
          python - <<'PY'
          import json
          p='receipts/JANUS_BIDIRECTIONAL_V2_1_ADVERSARIAL_LATEST.json'
          r=json.load(open(p,encoding='utf-8'))
          assert r['status']=='PASS_EXPECTED_NEGATIVES'
          assert r['all_expected_negatives_passed'] is True
          assert r['world_truth'] is False
          names={x['test'] for x in r['tests'] if x['passed']}
          required={'SOURCE_DESTRUCTION_REJECT','DREAM_TRAINING_REJECT','OUROBOROS_AUTO_MUTATION_REJECT','MISSING_LINK_STRUCTURED_HOLD','CORRELATED_EVIDENCE_REJECT'}
          assert required <= names, (required,names)
          PY
      - name: Preserve adversarial receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "janus-adversarial-v2-1"
          git config user.email "actions@users.noreply.github.com"
          git add receipts/JANUS_BIDIRECTIONAL_V2_1_ADVERSARIAL_LATEST.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Receipt: JANUS bidirectional v2.1 adversarial negatives [skip ci]"
          git push
