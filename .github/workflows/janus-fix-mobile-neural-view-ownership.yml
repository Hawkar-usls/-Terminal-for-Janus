name: JANUS Fix Mobile Neural View Ownership

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/janus-fix-mobile-neural-view-ownership.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Repair mobile CHAT view ownership and add regression gate
        run: |
          python - <<'PY'
          from pathlib import Path

          css_path = Path('assets/neural-link-v2.css')
          css = css_path.read_text(encoding='utf-8')
          old = '  #view-console.neural-link-active{height:100%;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:10px;padding:10px 12px}'
          new = '  #view-console.neural-link-active.active{height:100%;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:10px;padding:10px 12px}'
          if old not in css:
              raise SystemExit('EXPECTED_MOBILE_NEURAL_SELECTOR_NOT_FOUND')
          css = css.replace(old, new, 1)
          css_path.write_text(css, encoding='utf-8')

          test_path = Path('tests/test_terminal_v2_static.py')
          tests = test_path.read_text(encoding='utf-8')
          marker = 'def test_mobile_neural_link_obeys_terminal_view_ownership():'
          if marker not in tests:
              tests += '''\n\ndef test_mobile_neural_link_obeys_terminal_view_ownership():\n    css = (ROOT / "assets/neural-link-v2.css").read_text(encoding="utf-8")\n    assert "#view-console.neural-link-active.active{" in css\n    assert "#view-console.neural-link-active{height:100%;min-height:0;overflow:hidden;display:flex" not in css\n'''
              test_path.write_text(tests, encoding='utf-8')
          PY
          python -m pip install --quiet pytest
          python -m pytest -q tests/test_terminal_v2_static.py
      - name: Commit verified repair and remove one-shot workflow
        run: |
          git config user.name 'janus-terminal-repair'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/janus-fix-mobile-neural-view-ownership.yml
          git add assets/neural-link-v2.css tests/test_terminal_v2_static.py
          git commit -m 'JANUS Terminal: keep Neural Link inside active CHAT view'
          git push origin HEAD:main
