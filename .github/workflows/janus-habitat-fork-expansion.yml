name: JANUS Habitat Fork Proposal Preview (R1 execution blocked)

on:
  workflow_dispatch:
    inputs:
      upstream_full_name:
        description: Public owner/repo to inspect without credentials
        required: true
        type: string
      purpose:
        description: Why JANUS needs this reference
        required: true
        type: string
      expected_gain:
        description: Expected bounded utility
        required: true
        type: string
      requested_mode:
        description: Proposal mode only
        required: true
        default: REFERENCE_FORK
        type: choice
        options: [REFERENCE_FORK, ADAPTATION_FORK, COMPATIBILITY_FORK, EXPERIMENT_FORK]
      execute_if_gated:
        description: Legacy execution requests are rejected by R1
        required: true
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - 'fork_requests/**/*.json'
      - 'tools/janus_habitat_fork_expansion.py'
      - 'config/JANUS_R1_ADMISSION_BINDING.json'
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: janus-habitat-fork-preview
  cancel-in-progress: false

jobs:
  preview:
    if: github.repository == 'Hawkar-usls/-Terminal-for-Janus' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify the offline execution barrier and existing observer
        run: |
          python -m unittest discover -s tests -p 'test_janus_r1_fork_barrier.py' -v
          python -m unittest discover -s tests -p 'test_janus_ecosystem_observer.py' -v
      - name: Reject an execution request before inspecting any candidate
        if: github.event_name == 'workflow_dispatch' && inputs.execute_if_gated
        run: |
          echo 'R1_EXECUTION_BINDING_REQUIRED'
          exit 2
      - name: Prepare one bounded public metadata proposal
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUEST_UPSTREAM: ${{ inputs.upstream_full_name }}
          REQUEST_PURPOSE: ${{ inputs.purpose }}
          REQUEST_GAIN: ${{ inputs.expected_gain }}
          REQUEST_MODE: ${{ inputs.requested_mode }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          selected = None
          if os.environ['EVENT_NAME'] == 'workflow_dispatch':
              selected = {'request_id': 'manual-preview',
                          'upstream_full_name': os.environ['REQUEST_UPSTREAM'],
                          'purpose': os.environ['REQUEST_PURPOSE'],
                          'need_class': 'REFERENCE_PROPOSAL',
                          'expected_gain': os.environ['REQUEST_GAIN'],
                          'source_ref': 'MANUAL_PREVIEW',
                          'requested_mode': os.environ['REQUEST_MODE']}
          else:
              files = sorted(Path('fork_requests').glob('**/*.json')) if Path('fork_requests').exists() else []
              if len(files) > 16:
                  raise SystemExit('R1_CANDIDATE_LIMIT')
              for path in files:
                  if path.is_symlink() or not path.resolve().is_relative_to(Path('fork_requests').resolve()):
                      raise SystemExit('R1_UNSAFE_REQUEST_PATH')
                  if path.stat().st_size > 65536:
                      raise SystemExit('R1_REQUEST_TOO_LARGE')
                  selected = json.loads(path.read_text(encoding='utf-8-sig'))
                  break
          if selected is not None:
              Path(os.environ['RUNNER_TEMP'], 'r1-request.json').write_text(json.dumps(selected))
          PY
      - name: Inspect public metadata with no execution or credential binding
        run: |
          if [ -f "$RUNNER_TEMP/r1-request.json" ]; then
            python tools/janus_habitat_fork_expansion.py "$RUNNER_TEMP/r1-request.json" -o "$RUNNER_TEMP/r1-preview.json"
          fi
      - name: Keep the effect gate explicit
        if: always()
        run: |
          echo '## Fork execution gate' >> "$GITHUB_STEP_SUMMARY"
          echo 'HOLD: R1_EXECUTION_BINDING_REQUIRED. This workflow must not be automatically re-enabled on merge.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: janus-r1-fork-preview-${{ github.run_id }}
          path: ${{ runner.temp }}/r1-preview.json
          if-no-files-found: ignore
          retention-days: 14
