name: JANUS JSON Mirror Pass

on:
  push:
    paths:
      - 'contracts/JANUS_JSON_MIRROR_PASS_PROTOCOL-v1.0.json'
      - 'tools/janus_json_mirror_pass.py'
      - 'tests/test_janus_json_mirror_pass.py'
      - '.github/workflows/janus-json-mirror-pass.yml'
  pull_request:
    paths:
      - 'contracts/JANUS_JSON_MIRROR_PASS_PROTOCOL-v1.0.json'
      - 'tools/janus_json_mirror_pass.py'
      - 'tests/test_janus_json_mirror_pass.py'
      - '.github/workflows/janus-json-mirror-pass.yml'

permissions:
  contents: read

jobs:
  mirror-pass:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile reference engine
        run: python -m py_compile tools/janus_json_mirror_pass.py
      - name: Run mirror-pass tests
        run: python -m unittest -v tests/test_janus_json_mirror_pass.py
      - name: Validate frozen contract JSON
        run: python -m json.tool contracts/JANUS_JSON_MIRROR_PASS_PROTOCOL-v1.0.json > /dev/null
