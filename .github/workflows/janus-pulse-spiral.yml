name: JANUS Pulse Spiral

on:
  workflow_dispatch:
  push:
    paths:
      - "contracts/JANUS_PULSE_SPIRAL_PROTOCOL-v1.0.json"
      - "tools/janus_pulse_spiral.py"
      - "tools/janus_pulse_spiral_v1_1.py"
      - ".github/workflows/janus-pulse-spiral.yml"

permissions:
  contents: write

jobs:
  pulse-train:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Terminal
        uses: actions/checkout@v4

      - name: Fetch JANUS runtime subjects
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/Hawkar-usls/aura-oracle-tg.git ../aura-oracle-tg
          git clone --depth 1 https://github.com/Hawkar-usls/Demi_Head.git ../Demi_Head
          git clone --depth 1 https://github.com/Hawkar-usls/Hawkar-usls.git ../Hawkar-usls-home

      - name: Fire bounded pulse train
        shell: bash
        run: |
          set -euo pipefail
          python tools/janus_pulse_spiral_v1_1.py \
            --terminal . \
            --aura ../aura-oracle-tg \
            --demihead ../Demi_Head \
            --home ../Hawkar-usls-home \
            -o receipts/JANUS_PULSE_SPIRAL_LATEST.json

      - name: Preserve pulse receipts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "janus-pulse-spiral"
          git config user.email "actions@users.noreply.github.com"
          git add receipts/JANUS_PULSE_SPIRAL_LATEST.json receipts/pulse
          if git diff --cached --quiet; then
            echo "No pulse receipt delta to commit."
            exit 0
          fi
          git commit -m "Receipt: JANUS pulse spiral train [skip ci]"
          git push
