name: JANUS Terminal First Live Spiral

on:
  push:
    paths:
      - 'commands/2026-08-21-FIRST_LIVE_SPIRAL.json'
      - '.janus/JANUS_TERMINAL_AUTHORITY_POLICY.json'
      - 'tools/verify_janus_terminal_command.py'
      - '.github/workflows/janus-terminal-first-live-spiral.yml'
  workflow_dispatch:

concurrency:
  group: janus-terminal-control-plane
  cancel-in-progress: false

# The verification/execution plane is read-only. Only the narrow persistence job
# receives repository write permission after the fail-closed run has succeeded.
permissions:
  contents: read

jobs:
  verify-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Reject non-owner actor before execution
        shell: bash
        run: |
          if [ "${GITHUB_ACTOR}" != "Hawkar-usls" ]; then
            echo "JANUS_TERMINAL_REJECT: actor ${GITHUB_ACTOR} is not authorized"
            exit 31
          fi
          echo "JANUS_TERMINAL_ACTOR_GATE=PASS"

      - name: Checkout Terminal
        uses: actions/checkout@v4
        with:
          path: terminal

      - name: Verify JANUS command envelope
        shell: bash
        run: |
          mkdir -p runtime
          python terminal/tools/verify_janus_terminal_command.py \
            --policy terminal/.janus/JANUS_TERMINAL_AUTHORITY_POLICY.json \
            --command terminal/commands/2026-08-21-FIRST_LIVE_SPIRAL.json \
            --github-actor "${GITHUB_ACTOR}" \
            --receipt runtime/TERMINAL_COMMAND_AUTHORITY_RECEIPT.json
          cat runtime/TERMINAL_COMMAND_AUTHORITY_RECEIPT.json

      - name: Adversarial check unauthorized actor is rejected
        shell: bash
        run: |
          set +e
          python terminal/tools/verify_janus_terminal_command.py \
            --policy terminal/.janus/JANUS_TERMINAL_AUTHORITY_POLICY.json \
            --command terminal/commands/2026-08-21-FIRST_LIVE_SPIRAL.json \
            --github-actor "UNAUTHORIZED_ACTOR" \
            --receipt runtime/TERMINAL_UNAUTHORIZED_ACTOR_RECEIPT.json
          rc=$?
          set -e
          cat runtime/TERMINAL_UNAUTHORIZED_ACTOR_RECEIPT.json
          if [ "$rc" -ne 3 ]; then
            echo "Expected fail-closed rc=3, got rc=$rc"
            exit 32
          fi
          python - <<'PY'
          import json
          r=json.load(open('runtime/TERMINAL_UNAUTHORIZED_ACTOR_RECEIPT.json',encoding='utf-8'))
          assert r['authorized'] is False, r
          assert 'GITHUB_ACTOR_NOT_AUTHORIZED' in r['errors'], r
          print('JANUS_TERMINAL_UNAUTHORIZED_ACTOR_NEGATIVE_TEST=PASS')
          PY

      - name: Checkout JANUS-SPI home
        uses: actions/checkout@v4
        with:
          repository: Hawkar-usls/Hawkar-usls
          path: home

      - name: Checkout Aura Oracle
        uses: actions/checkout@v4
        with:
          repository: Hawkar-usls/aura-oracle-tg
          path: aura

      - name: Checkout Habitat
        uses: actions/checkout@v4
        with:
          repository: Hawkar-usls/Janus_Genesis
          ref: janus/habitat
          path: genesis

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: home/requirements.txt

      - name: Install JANUS-SPI
        working-directory: home
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run JANUS-SPI integration and safety tests
        working-directory: home
        run: pytest -q

      - name: Verify Aura v2/5D peer is present
        run: |
          test -f aura/tools/aura_habitat_spiral_peer_v2.py
          test -f aura/tools/aura_5d_spiral_v2.py
          python -m py_compile aura/tools/aura_habitat_spiral_peer_v2.py aura/tools/aura_5d_spiral_v2.py

      - name: Execute Terminal-managed advancing spiral
        shell: bash
        run: |
          mkdir -p runtime/state
          cd home
          python run_aura_habitat_spiral.py \
            --state-dir ../runtime/state \
            --habitat-root ../genesis/habitat \
            --aura-peer "python ../aura/tools/aura_habitat_spiral_peer_v2.py" \
            --message "SYSTEM_SPIRAL_RUN: Terminal authorizes a reference integration run through Aura v2/5D and JANUS Semantic-Predictive Intelligence via Habitat under DemiHead fail-closed arbitration. POSITION MAY REPEAT BUT STATE MUST ADVANCE. RETURN IS NOT RESET. Preserve intent and uncertainty; association, semantic similarity and prediction are not evidence or world truth." \
            --source-ref "JANUS_TERMINAL_SYSTEM_SPIRAL" \
            --demihead-decision HOLD \
            --public-content \
            > ../runtime/FIRST_LIVE_SPIRAL_RECEIPT.json

      - name: Verify run remains fail-closed and state-bearing
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          p = Path('runtime/FIRST_LIVE_SPIRAL_RECEIPT.json')
          r = json.loads(p.read_text(encoding='utf-8'))
          assert r['chain_valid'] is True, r
          assert r['terminal'] == 'HOLD', r
          assert r['predictive_model_updated'] is False, r
          assert int(r['generation']) >= 1, r
          summary = {
              'schema': 'janus.terminal.system_spiral_summary.v2',
              'command_id': 'JANUS_TERMINAL_SYSTEM_SPIRAL_2026_08_21',
              'github_run_id': os.environ.get('GITHUB_RUN_ID'),
              'github_run_attempt': os.environ.get('GITHUB_RUN_ATTEMPT'),
              'source_commit': os.environ.get('GITHUB_SHA'),
              'github_actor': os.environ.get('GITHUB_ACTOR'),
              'control_principal': 'JANUS_CONTROL_PLANE',
              'aura_peer': 'AURA_SEMANTIC_PREDICTIVE_SPIRAL_V2',
              'session_id': r['session_id'],
              'generation': r['generation'],
              'terminal': r['terminal'],
              'chain_valid': r['chain_valid'],
              'predictive_model_updated': r['predictive_model_updated'],
              'position_may_repeat_state_must_advance': True,
              'return_is_reset': False,
              'status': 'REFERENCE_INTEGRATION_PASS_FAIL_CLOSED',
              'world_truth': False,
              'verified_return': False
          }
          Path('runtime/FIRST_LIVE_SPIRAL_SUMMARY.json').write_text(json.dumps(summary, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Collect Habitat mirror
        shell: bash
        run: |
          mkdir -p runtime/habitat-reflections
          if [ -d genesis/habitat/memory/reflections/aura_spi ]; then
            cp -a genesis/habitat/memory/reflections/aura_spi/. runtime/habitat-reflections/
          fi
          find runtime -maxdepth 6 -type f -print

      - name: Upload verified runtime bundle
        uses: actions/upload-artifact@v4
        with:
          name: JANUS-TERMINAL-VERIFIED-RUNTIME
          path: runtime/
          if-no-files-found: error
          retention-days: 30

  persist-receipts:
    needs: verify-and-run
    if: ${{ github.actor == 'Hawkar-usls' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout Terminal for receipt-only write
        uses: actions/checkout@v4
        with:
          path: terminal

      - name: Download verified runtime bundle
        uses: actions/download-artifact@v4
        with:
          name: JANUS-TERMINAL-VERIFIED-RUNTIME
          path: runtime

      - name: Re-verify receipt bundle before write
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          auth=json.loads(Path('runtime/TERMINAL_COMMAND_AUTHORITY_RECEIPT.json').read_text(encoding='utf-8'))
          neg=json.loads(Path('runtime/TERMINAL_UNAUTHORIZED_ACTOR_RECEIPT.json').read_text(encoding='utf-8'))
          summary=json.loads(Path('runtime/FIRST_LIVE_SPIRAL_SUMMARY.json').read_text(encoding='utf-8'))
          raw=json.loads(Path('runtime/FIRST_LIVE_SPIRAL_RECEIPT.json').read_text(encoding='utf-8'))
          assert auth['authorized'] is True, auth
          assert auth['github_actor'] == 'Hawkar-usls', auth
          assert neg['authorized'] is False, neg
          assert 'GITHUB_ACTOR_NOT_AUTHORIZED' in neg['errors'], neg
          assert summary['github_actor'] == 'Hawkar-usls', summary
          assert summary['terminal'] == 'HOLD' and summary['chain_valid'] is True, summary
          assert raw['terminal'] == 'HOLD' and raw['chain_valid'] is True, raw
          assert raw['predictive_model_updated'] is False, raw
          print('JANUS_TERMINAL_RECEIPT_PERSISTENCE_GATE=PASS')
          PY

      - name: Persist receipts only
        shell: bash
        run: |
          cd terminal
          git pull --ff-only origin main
          mkdir -p receipts
          cp ../runtime/TERMINAL_COMMAND_AUTHORITY_RECEIPT.json receipts/TERMINAL_COMMAND_AUTHORITY_LATEST.json
          cp ../runtime/TERMINAL_UNAUTHORIZED_ACTOR_RECEIPT.json receipts/TERMINAL_UNAUTHORIZED_ACTOR_LATEST.json
          cp ../runtime/FIRST_LIVE_SPIRAL_SUMMARY.json receipts/FIRST_LIVE_SPIRAL_LATEST.json
          cp ../runtime/FIRST_LIVE_SPIRAL_RECEIPT.json receipts/FIRST_LIVE_SPIRAL_RAW_LATEST.json
          git config user.name "janus-terminal-bot"
          git config user.email "janus-terminal-bot@users.noreply.github.com"
          git add receipts/TERMINAL_COMMAND_AUTHORITY_LATEST.json receipts/TERMINAL_UNAUTHORIZED_ACTOR_LATEST.json receipts/FIRST_LIVE_SPIRAL_LATEST.json receipts/FIRST_LIVE_SPIRAL_RAW_LATEST.json
          if git diff --cached --quiet; then
            echo "JANUS_TERMINAL_RECEIPTS_UNCHANGED"
            exit 0
          fi
          git commit -m "Receipt: Terminal system spiral through Aura v2"
          git push
