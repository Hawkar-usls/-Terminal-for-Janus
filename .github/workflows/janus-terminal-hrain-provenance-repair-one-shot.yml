name: JANUS Terminal HRAiN Provenance Repair One-Shot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/janus-terminal-hrain-provenance-repair-one-shot.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: janus-terminal-hrain-provenance-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply isolated HRAiN provenance patch
        run: python .janus/patch_terminal_hrain_provenance.py
      - name: Validate browser and static contract
        run: |
          python -m pip install --quiet pytest
          node --check assets/terminal-v2.js
          python -m pytest -q tests/test_terminal_v2_static.py
          grep -Fq 'VALID_EMPTY_RETRIEVAL' assets/terminal-v2.js
          grep -Fq 'empty ≠ negative evidence' assets/terminal-v2.js
      - name: Persist repair and retire bootstrap files
        run: |
          set -euo pipefail
          git config user.name 'janus-terminal-hrain-provenance'
          git config user.email 'janus-terminal-hrain-provenance@users.noreply.github.com'
          git rm .github/workflows/janus-terminal-hrain-provenance-repair-one-shot.yml
          git rm .janus/patch_terminal_hrain_provenance.py
          git add assets/terminal-v2.js tests/test_terminal_v2_static.py
          git commit -m 'JANUS Terminal: render proof-carrying HRAiN provenance'
          git pull --rebase origin main
          git push origin HEAD:main
