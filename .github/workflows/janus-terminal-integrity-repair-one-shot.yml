name: JANUS Terminal Integrity Repair One-Shot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/janus-terminal-integrity-repair-one-shot.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: janus-terminal-integrity-repair-one-shot
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply Terminal integrity repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          
          
          def replace_exact(path, old, new, count=None):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'ANCHOR_NOT_FOUND:{path}:{old[:120]!r}')
              s2 = s.replace(old, new) if count is None else s.replace(old, new, count)
              if s2 == s:
                  raise SystemExit(f'NO_CHANGE:{path}')
              p.write_text(s2, encoding='utf-8')
          
          
          # ---- index.html: make active-vs-candidate truth explicit and restore wired IDs ----
          p='index.html'
          s=Path(p).read_text(encoding='utf-8')
          repls=[
          ('''      <span id="brain-pill" class="pill">BRAIN …</span>\n      <span id="core-pill" class="pill"><span class="dot"></span>LOADING</span>''',
           '''      <span id="brain-pill" class="pill">BRAIN …</span>\n      <span id="trump-pill" class="pill">TRUMP ?</span>\n      <span id="core-pill" class="pill"><span class="dot"></span>LOADING</span>'''),
          ('''          <div><label>eval loss</label><strong id="chat-loss">—</strong></div>\n          <div><label>promotions</label><strong id="chat-promotions">—</strong></div>''',
           '''          <div><label>active brain loss</label><strong id="chat-loss">—</strong></div>\n          <div><label>last candidate</label><strong id="chat-candidate-loss">—</strong></div>\n          <div><label>promoted / attempts</label><strong id="chat-promotions">—</strong></div>'''),
          ('''          <article class="metric-card"><label>current eval loss</label><strong id="brain-loss">—</strong><small id="brain-loss-delta">—</small></article>''',
           '''          <article class="metric-card"><label>active brain eval loss</label><strong id="brain-loss">—</strong><small id="brain-loss-delta">authoritative incumbent for latest eval context</small></article>'''),
          ('''          <article class="metric-card"><label>training attempts</label><strong id="brain-attempts">—</strong><small>bounded incremental turns</small></article>''',
           '''          <article class="metric-card"><label>last candidate eval loss</label><strong id="brain-last-candidate">—</strong><small id="brain-last-candidate-status">candidate verdict unresolved</small></article>\n          <article class="metric-card"><label>training attempts</label><strong id="brain-attempts">—</strong><small>bounded incremental turns</small></article>'''),
          ('''          <article class="metric-card"><label>repository modules</label><strong id="brain-module-count">—</strong><small>typed organ context</small></article>''',
           '''          <article class="metric-card"><label>repository modules</label><strong id="brain-module-count">—</strong><small id="brain-module-count-note">typed organ context</small></article>'''),
          ('''          <article class="card wide chart-card"><div class="card-title-row"><h3>LEARNING LINEAGE · EVAL LOSS</h3><span id="brain-lineage-summary" class="mono muted">—</span></div><div id="loss-chart" class="loss-chart"></div><div id="loss-axis" class="loss-axis"></div></article>''',
           '''          <article class="card wide chart-card"><div class="card-title-row"><h3>EVAL TRACE · ACTIVE VS CANDIDATE</h3><span id="brain-lineage-summary" class="mono muted">—</span></div><div class="chart-legend"><span class="legend-active">ACTIVE / INCUMBENT</span><span class="legend-promoted">PROMOTED CANDIDATE</span><span class="legend-rejected">REJECTED CANDIDATE</span></div><div id="loss-chart" class="loss-chart"></div><div id="loss-axis" class="loss-axis"></div><div class="chart-truth">ACTIVE CHECKPOINT + PROMOTION VERDICT ARE AUTHORITATIVE. EVAL VALUES FROM DIFFERENT SOURCE DIGESTS ARE NOT A SINGLE FROZEN BENCHMARK.</div></article>'''),
          ('''          <article class="metric-card"><label>observed modules</label><strong id="modules-count">—</strong><small>Scout-bound repositories</small></article>''',
           '''          <article class="metric-card"><label>repository modules</label><strong id="modules-count">—</strong><small id="modules-count-note">Scout-bound repositories</small></article>'''),
          ('''          <article class="card wide"><h3>Native brain checkpoint</h3><div id="organism-native-checkpoint" class="datum">—</div></article>\n          <article class="card wide"><h3>Organism laws</h3>''',
           '''          <article class="card wide"><h3>Native brain checkpoint</h3><div id="organism-native-checkpoint" class="datum">—</div></article>\n          <article class="card wide tissue-card"><div class="tissue-head"><div><h3>Candidate runtime tissue</h3><div class="tissue-name">TRUMP</div></div><div id="organism-trump-state" class="tissue-state unresolved">UNRESOLVED</div></div><div class="tissue-grid"><div><label>runtime</label><strong id="organism-trump-runtime">—</strong></div><div><label>wake / use</label><strong id="organism-trump-wake">—</strong></div><div><label>self improve</label><strong id="organism-trump-improve">—</strong></div><div><label>proof authority</label><strong id="organism-trump-proof">—</strong></div><div><label>P vs NP</label><strong id="organism-trump-pnp">—</strong></div><div><label>manifest digest</label><strong id="organism-trump-digest">—</strong></div></div><div class="candidate-note">Candidate runtime status is observability only. TRUMP wake/use does not grant theorem, command, external-effect or scientific-claim authority.</div></article>\n          <article class="card wide"><h3>Organism laws</h3>'''),
          ('''      <div class="metric"><label>native loss</label><div id="side-native-loss">—</div></div>\n      <div class="metric"><label>model_digest</label><div id="side-model">—</div></div>\n      <div class="metric"><label>turn_id</label><div id="side-turn">—</div></div>''',
           '''      <div class="metric"><label>active native loss</label><div id="side-native-loss">—</div></div>\n      <div class="metric"><label>last candidate</label><div id="side-native-candidate">—</div></div>\n      <div class="metric"><label>model_digest</label><div id="side-model">—</div></div>\n      <div class="metric"><label>file_fabric_digest</label><div id="side-fabric">—</div></div>\n      <div class="metric"><label>turn_id</label><div id="side-turn">—</div></div>\n      <div class="metric"><label>response_hash</label><div id="side-response">—</div></div>\n      <div class="metric"><label>TRUMP runtime</label><div id="side-trump">—</div></div>'''),
          ]
          for old,new in repls:
              if old not in s:
                  raise SystemExit('INDEX_ANCHOR_NOT_FOUND:'+old[:100])
              s=s.replace(old,new)
          Path(p).write_text(s,encoding='utf-8')
          
          # ---- janus-observatory.js: active checkpoint truth, chart truth, resilient optional reads ----
          p='assets/janus-observatory.js'
          s=Path(p).read_text(encoding='utf-8')
          s=s.replace('''    organAccess: null,\n    refreshedAt: null,\n  };''','''    organAccess: null,\n    refreshedAt: null,\n    refreshInFlight: false,\n  };''')
          old='''  const fmt = (v, digits = 5) => Number.isFinite(Number(v)) ? Number(v).toFixed(digits) : '—';\n'''
          new='''  const fmt = (v, digits = 5) => Number.isFinite(Number(v)) ? Number(v).toFixed(digits) : '—';\n  const finite = (v) => Number.isFinite(Number(v));\n  const promoted = (row) => row?.status === 'PROMOTED';\n  const activeLossForRow = (row) => {\n    if (!row) return null;\n    if (promoted(row) && finite(row.candidate_eval_loss)) return Number(row.candidate_eval_loss);\n    if (finite(row.incumbent_eval_loss)) return Number(row.incumbent_eval_loss);\n    return finite(row.candidate_eval_loss) ? Number(row.candidate_eval_loss) : null;\n  };\n\n  function modelIntegrity(model) {\n    const history = Array.isArray(model?.history) ? model.history : [];\n    const promotedRows = history.filter(promoted);\n    const latestPromoted = promotedRows.length ? promotedRows[promotedRows.length - 1] : null;\n    const checks = {\n      attempt_count_matches_history: Number(model?.attempt_count) === history.length,\n      promotion_plus_rejection_matches_attempts: Number(model?.promotion_count) + Number(model?.rejection_count) === Number(model?.attempt_count),\n      active_checkpoint_matches_last_promoted: !latestPromoted || !model?.checkpoint_sha256 || latestPromoted.checkpoint_sha256 === model.checkpoint_sha256,\n    };\n    return { pass: Object.values(checks).every(Boolean), checks };\n  }\n'''
          if old not in s: raise SystemExit('OBS_HELPER_ANCHOR')
          s=s.replace(old,new)
          start=s.index('  function renderBrainBasics() {')
          end=s.index('\n  function renderLossChart() {',start)
          newblock='''  function renderBrainBasics() {\n    const m = obs.model || {};\n    const cfg = m.config || {};\n    const last = latestHistory() || {};\n    const manifest = obs.manifest || {};\n    const params = manifest?.architecture?.parameter_count;\n    const activeLoss = activeLossForRow(last);\n    const candidateLoss = finite(last.candidate_eval_loss) ? Number(last.candidate_eval_loss) : null;\n    const incumbent = finite(last.incumbent_eval_loss) ? Number(last.incumbent_eval_loss) : null;\n    const candidateDelta = candidateLoss != null && incumbent != null ? incumbent - candidateLoss : null;\n    const checkpoint = m.checkpoint_sha256 || 'UNRESOLVED';\n    const integrity = modelIntegrity(m);\n    const lastVerdict = last.status || m.last_training_status || 'UNRESOLVED';\n\n    set('brain-checkpoint', checkpoint);\n    set('brain-status', integrity.pass ? (m.status || 'UNRESOLVED') : `STATE INTEGRITY WARNING · ${m.status || 'UNRESOLVED'}`);\n    set('brain-loss', fmt(activeLoss, 6));\n    set('brain-loss-delta', promoted(last) ? 'candidate promoted → active brain' : `incumbent retained · last candidate ${lastVerdict}`);\n    set('brain-last-candidate', fmt(candidateLoss, 6));\n    set('brain-last-candidate-status', candidateDelta == null ? lastVerdict : `${lastVerdict} · candidate ${candidateDelta >= 0 ? 'better adaptive' : 'worse adaptive'} by ${Math.abs(candidateDelta).toFixed(6)}`);\n    set('brain-attempts', m.attempt_count ?? '—');\n    set('brain-promote-reject', `${m.promotion_count ?? '—'} / ${m.rejection_count ?? '—'}`);\n    set('brain-params', Number.isFinite(Number(params)) ? Number(params).toLocaleString('en-US') : '—');\n    set('brain-architecture', `${manifest?.architecture?.family || 'causal_transformer'} · ${cfg.n_layers ?? '?'}L × ${cfg.n_heads ?? '?'}H × d${cfg.d_model ?? '?'}`);\n    set('chat-checkpoint', short(checkpoint, 20));\n    set('chat-loss', fmt(activeLoss, 5));\n    set('chat-candidate-loss', `${fmt(candidateLoss, 5)} · ${lastVerdict}`);\n    set('chat-promotions', `${m.promotion_count ?? '—'}/${m.attempt_count ?? '—'}`);\n    set('side-native-checkpoint', short(checkpoint, 18));\n    set('side-native-loss', fmt(activeLoss, 6));\n    set('side-native-candidate', `${fmt(candidateLoss, 6)} · ${lastVerdict}`);\n    set('organism-native-checkpoint', checkpoint);\n    set('brain-live-status', integrity.pass ? (m.status === 'NATIVE_MODEL_PROMOTED' ? 'ACTIVE CHECKPOINT VERIFIED' : (m.status || 'UNRESOLVED')) : 'STATE INTEGRITY WARNING');\n\n    const pill = $('brain-pill');\n    if (pill) {\n      pill.textContent = `BRAIN ${m.promotion_count ?? '?'}/${m.attempt_count ?? '?'} · L ${fmt(activeLoss, 3)}`;\n      pill.classList.toggle('live', integrity.pass && m.status === 'NATIVE_MODEL_PROMOTED');\n      pill.classList.toggle('warn', !integrity.pass);\n      pill.title = `active checkpoint ${checkpoint} · last candidate ${fmt(candidateLoss,6)} ${lastVerdict}`;\n    }\n\n    const rows = [\n      ['context_length', cfg.context_length], ['d_model', cfg.d_model], ['n_heads', cfg.n_heads],\n      ['n_layers', cfg.n_layers], ['ff_mult', cfg.ff_mult], ['dropout', cfg.dropout], ['vocab_size', cfg.vocab_size],\n      ['checkpoint', short(checkpoint, 22)], ['last_training', lastVerdict],\n    ];\n    const box = $('brain-config');\n    if (box) box.innerHTML = rows.map(([k, v]) => `<div class="kv-row"><span>${esc(k)}</span><b>${esc(v ?? '—')}</b></div>`).join('');\n  }\n'''
          s=s[:start]+newblock+s[end:]
          start=s.index('  function renderLossChart() {')
          end=s.index('\n  function inferLatestDecisionFromIndex()',start)
          newblock='''  function renderLossChart() {\n    const history = (obs.model?.history || []).filter((x) => finite(x.candidate_eval_loss));\n    const chart = $('loss-chart');\n    const axis = $('loss-axis');\n    if (!chart || !history.length) return;\n    const candidateVals = history.map((x) => Number(x.candidate_eval_loss));\n    const activeVals = history.map((x) => activeLossForRow(x));\n    const allVals = [...candidateVals, ...activeVals.filter(finite)].map(Number);\n    let min = Math.min(...allVals), max = Math.max(...allVals);\n    if (max === min) { max += 0.1; min -= 0.1; }\n    const pad = (max - min) * 0.12;\n    min -= pad; max += pad;\n    const W = 1000, H = 170, left = 18, right = 12, top = 10, bottom = 14;\n    const x = (i) => left + (history.length === 1 ? (W-left-right)/2 : i * (W-left-right)/(history.length-1));\n    const y = (v) => top + (max-v) * (H-top-bottom)/(max-min);\n    const activePoints = activeVals.map((v, i) => `${x(i)},${y(Number(v))}`).join(' ');\n    const grid = [0.25,0.5,0.75].map((r) => `<line class="grid" x1="${left}" x2="${W-right}" y1="${top+r*(H-top-bottom)}" y2="${top+r*(H-top-bottom)}"/>`).join('');\n    const dots = candidateVals.map((v,i) => {\n      const cls = promoted(history[i]) ? 'promoted' : 'rejected';\n      const last = i === history.length - 1 ? ' latest' : '';\n      return `<circle class="candidate-point ${cls}${last}" cx="${x(i)}" cy="${y(v)}" r="${i===history.length-1?4.8:3.1}"><title>attempt ${i+1}: candidate ${v.toFixed(6)} · ${esc(history[i].status || 'UNKNOWN')} · active ${fmt(activeVals[i],6)}</title></circle>`;\n    }).join('');\n    chart.innerHTML = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-label="JANUS active brain and candidate evaluation trace">${grid}<polyline class="active-curve" points="${activePoints}"/>${dots}</svg>`;\n    const m = obs.model || {};\n    axis.innerHTML = `<span>attempt 1 active · ${fmt(activeVals[0],4)}</span><span>${m.promotion_count ?? '?'} promoted · ${m.rejection_count ?? '?'} rejected</span><span>attempt ${history.length} active · ${fmt(activeVals[activeVals.length-1],4)}</span>`;\n    const last = history[history.length - 1];\n    set('brain-lineage-summary', `${history.length} attempts · ${m.promotion_count ?? '?'} promoted · ${m.rejection_count ?? '?'} rejected · last ${last.status || 'UNKNOWN'}`);\n  }\n'''
          s=s[:start]+newblock+s[end:]
          # Module truth note
          old="""    set('brain-module-count', resolvedCount);\n    set('modules-count', resolvedCount);\n    set('modules-attempts', registry?.global_mutation_policy?.max_patch_attempts ?? 2);"""
          new="""    set('brain-module-count', resolvedCount);\n    set('modules-count', resolvedCount);\n    set('brain-module-count-note', rows.length ? `${rows.length} Scout-observed organs` : observedMapStale ? 'registry fallback · observed map stale' : 'typed organ context unresolved');\n    set('modules-count-note', rows.length ? `${rows.length} Scout-observed repositories` : observedMapStale ? 'registered count · observed map stale' : 'Scout-bound repositories unresolved');\n    set('modules-attempts', registry?.global_mutation_policy?.max_patch_attempts ?? 2);"""
          if old not in s: raise SystemExit('MODULE_ANCHOR')
          s=s.replace(old,new)
          # replace renderLogs
          start=s.index('  function renderLogs() {')
          end=s.index('\n  async function loadAll()',start)
          newblock='''  function renderLogs() {\n    const rows = [];\n    let seq = 1;\n    for (const h of obs.model?.history || []) {\n      const candidate = fmt(h.candidate_eval_loss, 6);\n      const incumbent = finite(h.incumbent_eval_loss) ? fmt(h.incumbent_eval_loss,6) : 'bootstrap';\n      const active = fmt(activeLossForRow(h), 6);\n      const verdict = h.status || 'UNKNOWN';\n      rows.push(logRow(seq++, 'TRAIN', `run ${h.run_id} · incumbent ${incumbent} → candidate ${candidate} · active ${active} · active checkpoint ${short(h.checkpoint_sha256,16)}`, verdict, verdict==='PROMOTED'?'':'warn'));\n    }\n    const d = obs.decision || inferLatestDecisionFromIndex();\n    if (d) {\n      const selected = d.selected?.candidate_id || d.selected_candidate_id || 'NO_ACTION';\n      rows.push(logRow(seq++, 'DECIDE', `${selected} · checkpoint ${short(d.checkpoint_sha256,16)} · ${d.gate_reason || 'persisted native selection'}`, d.status || 'RECORDED', d.status==='NO_ACTION'?'warn':''));\n      if (d.status && d.status !== 'NO_ACTION') rows.push(logRow(seq++, 'PATCH', `${d.selected?.target?.repository || 'target'} · ${d.selected?.verification_profile || 'local verifier'} · proposal must be applied only through target-bounded write lane`, 'AWAIT VERIFY', 'warn'));\n    }\n    const mods = obs.modules?.modules || [];\n    if (mods.length) rows.push(logRow(seq++, 'SCOUT', `${mods.length} repository organs present in SELF observed-module state`, 'OBSERVED'));\n    rows.push(logRow(seq++, 'MEMORY', 'Durable evidence is append-only: supersede, quarantine or mark stale; never erase failures, negative results or counterexamples.', 'NO DELETE'));\n    rows.push(logRow(seq++, 'LAW', 'Rejected candidate != active brain. No verification = no PASS. Model output is not independent evidence. Autonomous merge remains disabled.', 'ENFORCED'));\n    const box = $('janus-event-log');\n    if (box) {\n      box.innerHTML = rows.length ? rows.slice().reverse().join('') : '<div class="empty-state">No persisted events resolved.</div>';\n      document.dispatchEvent(new CustomEvent('janus:logs-rendered'));\n    }\n  }\n'''
          s=s[:start]+newblock+s[end:]
          # resilient loadAll
          start=s.index('  async function loadAll() {')
          end=s.index('\n  function renderAll()',start)
          newblock='''  async function loadAll() {\n    const [model, manifest, telemetry, latestDecision, organAccess, modules, registry, decisionIndex] = await Promise.all([\n      json(URLS.modelState), json(URLS.modelManifest), json(URLS.weightTelemetry, true),\n      json(URLS.latestDecision, true), json(URLS.organAccess, true), json(URLS.moduleState, true), json(URLS.moduleRegistry, true), json(URLS.decisionIndex, true),\n    ]);\n    Object.assign(obs, { model, manifest, telemetry, decision: latestDecision, organAccess, modules, registry, decisionIndex, refreshedAt: new Date() });\n  }\n'''
          s=s[:start]+newblock+s[end:]
          # overlap guard
          start=s.index('  async function refreshObservatory() {')
          end=s.index("\n\n  document.addEventListener('DOMContentLoaded'",start)
          newblock='''  async function refreshObservatory() {\n    if (obs.refreshInFlight) return;\n    obs.refreshInFlight = true;\n    const btn = $('logs-refresh');\n    btn?.classList.add('loading-shimmer');\n    try {\n      await loadAll();\n      renderAll();\n    } catch (err) {\n      console.warn('JANUS_OBSERVATORY_UNRESOLVED', err);\n      set('brain-live-status', 'UNRESOLVED');\n      set('modules-live-status', 'UNRESOLVED');\n      const log = $('janus-event-log');\n      if (log) log.innerHTML = `<div class="empty-state">Git witness unresolved: ${esc(err?.message || err)}. Silence is not negative evidence.</div>`;\n    } finally {\n      obs.refreshInFlight = false;\n      btn?.classList.remove('loading-shimmer');\n    }\n  }\n'''
          s=s[:start]+newblock+s[end:]
          Path(p).write_text(s,encoding='utf-8')
          
          # ---- CSS: active/candidate semantics, extra strip field, mobile truth ----
          p='assets/janus-observatory.css'
          s=Path(p).read_text(encoding='utf-8')
          s=s.replace('.chat-brain-strip{display:grid;grid-template-columns:2fr repeat(3,1fr);', '.chat-brain-strip{display:grid;grid-template-columns:2fr repeat(4,minmax(0,1fr));')
          anchor='.loss-chart .point.latest{fill:var(--green)}.loss-axis{'
          if anchor not in s: raise SystemExit('CSS_CHART_ANCHOR')
          s=s.replace(anchor, '.loss-chart .active-curve{fill:none;stroke:var(--green);stroke-width:2;vector-effect:non-scaling-stroke}.loss-chart .candidate-point{fill:#07100c;stroke-width:2;vector-effect:non-scaling-stroke}.loss-chart .candidate-point.promoted{stroke:var(--green)}.loss-chart .candidate-point.rejected{stroke:var(--amber)}.loss-chart .candidate-point.latest{stroke-width:3}.chart-legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;font:7px/1 "IBM Plex Mono",monospace;letter-spacing:.07em}.chart-legend span:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px}.legend-active:before,.legend-promoted:before{background:var(--green)}.legend-rejected:before{background:var(--amber)}.chart-truth{margin-top:8px;color:var(--dim);font:7px/1.45 "IBM Plex Mono",monospace;letter-spacing:.03em}.loss-axis{')
          s=s.replace('@media(max-width:720px){.observatory-head', '@media(max-width:720px){#trump-pill{display:none}.observatory-head')
          Path(p).write_text(s,encoding='utf-8')
          
          # ---- synthesis log survives observatory refresh and follows log DOM contract ----
          p='assets/janus-synthesis-observatory.js'
          s=Path(p).read_text(encoding='utf-8')
          s=s.replace('let lastStateSha=null;','let lastStateSha=null;\nlet lastSynthState=null;')
          old='''function publishLogEvent(x){\n const log=document.getElementById('janus-event-log');if(!log||log.querySelector('[data-terminal-synth-event]'))return;\n const latest=(x.candidates||[]).slice(-1)[0];if(!latest)return;\n const row=document.createElement('div');row.className='event-row';row.dataset.terminalSynthEvent='1';row.innerHTML=`<div class="event-id">SYNTH</div><div class="event-type">COMPOSE</div><div class="event-body"><div>${esc(latest.label)}</div><strong class="good">CANDIDATE_AWAITING_CORROBORATION</strong></div>`;log.prepend(row);\n}\n'''
          new='''function publishLogEvent(x=lastSynthState){\n const log=document.getElementById('janus-event-log');if(!log||!x||log.querySelector('[data-terminal-synth-event]'))return;\n const latest=(x.candidates||[]).slice(-1)[0];if(!latest)return;\n const row=document.createElement('div');row.className='log-row';row.dataset.terminalSynthEvent='1';row.innerHTML=`<span class="log-seq">#SYN</span><span class="log-type">COMPOSE</span><span class="log-body">${esc(latest.label)} · durable semantic candidate</span><span class="log-verdict warn">CANDIDATE</span>`;log.prepend(row);\n}\n'''
          if old not in s: raise SystemExit('SYNTH_PUBLISH_ANCHOR')
          s=s.replace(old,new)
          s=s.replace("   const x=validate(await r.json());", "   const x=validate(await r.json());lastSynthState=x;")
          s=s.replace("function boot(){installView();loadSynth();setInterval(loadSynth,REFRESH_MS);}", "function boot(){installView();document.addEventListener('janus:logs-rendered',()=>publishLogEvent());loadSynth();setInterval(loadSynth,REFRESH_MS);}")
          Path(p).write_text(s,encoding='utf-8')
          
          # ---- static tests: cover integrated observatory truth surface ----
          p='tests/test_terminal_v2_static.py'
          s=Path(p).read_text(encoding='utf-8')
          append='''\n\ndef test_observatory_distinguishes_active_brain_from_last_candidate():\n    html = (ROOT / "index.html").read_text(encoding="utf-8")\n    js = (ROOT / "assets/janus-observatory.js").read_text(encoding="utf-8")\n    assert "active brain eval loss" in html\n    assert 'id="brain-last-candidate"' in html\n    assert 'id="chat-candidate-loss"' in html\n    assert "activeLossForRow" in js\n    assert "Rejected candidate != active brain" in js\n    assert "candidate_eval_loss" in js and "incumbent_eval_loss" in js\n    assert "BRAIN ${m.promotion_count" in js\n\n\ndef test_observatory_has_state_integrity_and_resilient_auxiliary_reads():\n    js = (ROOT / "assets/janus-observatory.js").read_text(encoding="utf-8")\n    assert "modelIntegrity" in js\n    assert "STATE INTEGRITY WARNING" in js\n    assert "json(URLS.moduleState, true)" in js\n    assert "json(URLS.moduleRegistry, true)" in js\n    assert "refreshInFlight" in js\n\n\ndef test_terminal_restores_all_runtime_readout_targets():\n    html = (ROOT / "index.html").read_text(encoding="utf-8")\n    for element_id in ("side-fabric", "side-response", "side-trump", "side-native-candidate"):\n        assert f'id="{element_id}"' in html\n\n\ndef test_synthesis_log_uses_primary_event_log_contract_and_rehydrates():\n    js = (ROOT / "assets/janus-synthesis-observatory.js").read_text(encoding="utf-8")\n    assert "row.className='log-row'" in js\n    assert "janus:logs-rendered" in js\n    assert "lastSynthState" in js\n'''
          if 'test_observatory_distinguishes_active_brain_from_last_candidate' not in s:
              s += append
          Path(p).write_text(s,encoding='utf-8')
          
          # ---- both UI CI workflows now cover all integrated UI runtimes ----
          for p in ['.github/workflows/janus-terminal-v2-ui.yml','.github/workflows/janus-terminal-v2.2-ui.yml']:
              s=Path(p).read_text(encoding='utf-8')
              s=s.replace("      - 'tests/test_terminal_v2_static.py'", "      - 'tests/**'")
              if "      - 'assets/janus-observatory.js'" not in s:
                  s=s.replace("      - 'assets/terminal-v2.js'", "      - 'assets/terminal-v2.js'\n      - 'assets/janus-observatory.js'\n      - 'assets/janus-observatory.css'\n      - 'assets/janus-synthesis-observatory.js'")
              if p.endswith('janus-terminal-v2-ui.yml'):
                  old='''      - name: Syntax-check browser runtime\n        run: node --check assets/terminal-v2.js'''
                  new='''      - name: Syntax-check browser runtimes\n        run: |\n          node --check assets/terminal-v2.js\n          node --check assets/janus-observatory.js\n          node --check assets/janus-synthesis-observatory.js'''
                  if old not in s: raise SystemExit('V2_SYNTAX_ANCHOR')
                  s=s.replace(old,new)
              else:
                  anchor="""      - name: Run static architecture tests\n        run: python -m pytest -q tests/test_terminal_v2_static.py"""
                  if anchor not in s: raise SystemExit('V22_STATIC_ANCHOR')
                  s=s.replace(anchor,"""      - name: Syntax-check browser runtimes\n        run: |\n          node --check assets/terminal-v2.js\n          node --check assets/janus-observatory.js\n          node --check assets/janus-synthesis-observatory.js\n      - name: Run static architecture tests\n        run: python -m pytest -q tests/test_terminal_v2_static.py""")
              Path(p).write_text(s,encoding='utf-8')
          
          print('TERMINAL_INTEGRITY_PATCH_APPLIED')
          PY
      - name: Validate repaired browser runtimes
        run: |
          node --check assets/terminal-v2.js
          node --check assets/janus-observatory.js
          node --check assets/janus-synthesis-observatory.js
      - name: Validate repaired Terminal tests
        run: |
          python -m pip install --quiet pytest
          python -m pytest -q tests/test_terminal_v2_static.py
      - name: Verify key truth invariants
        run: |
          grep -Fq 'active brain eval loss' index.html
          grep -Fq 'Rejected candidate != active brain' assets/janus-observatory.js
          grep -Fq 'id="organism-trump-state"' index.html
          grep -Fq 'id="side-fabric"' index.html
          grep -Fq 'id="side-response"' index.html
          grep -Fq 'id="side-trump"' index.html
          grep -Fq "row.className='log-row'" assets/janus-synthesis-observatory.js
      - name: Persist repair and retire one-shot workflow
        run: |
          git config user.name 'janus-terminal-integrity-repair'
          git config user.email 'janus-terminal-integrity-repair@users.noreply.github.com'
          git rm .github/workflows/janus-terminal-integrity-repair-one-shot.yml
          git add index.html assets/janus-observatory.js assets/janus-observatory.css assets/janus-synthesis-observatory.js tests/test_terminal_v2_static.py .github/workflows/janus-terminal-v2-ui.yml .github/workflows/janus-terminal-v2.2-ui.yml
          git commit -m 'JANUS Terminal: separate active brain from rejected candidates'
          git pull --rebase origin main
          git push origin HEAD:main
