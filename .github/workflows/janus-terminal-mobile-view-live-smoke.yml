name: JANUS Terminal Mobile View Live Smoke

on:
  push:
    branches: [main]
    paths:
      - 'assets/neural-link-v2.css'
      - 'tests/test_terminal_v2_static.py'
      - '.github/workflows/janus-terminal-mobile-view-live-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-mobile-view:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PAGES_CSS: https://hawkar-usls.github.io/-Terminal-for-Janus/assets/neural-link-v2.css
    steps:
      - uses: actions/checkout@v4
      - name: Verify live Pages preserves single-view ownership
        run: |
          set -euo pipefail
          local_sha="$(sha256sum assets/neural-link-v2.css | awk '{print $1}')"
          for attempt in $(seq 1 30); do
            nonce="${GITHUB_SHA}-${GITHUB_RUN_ID}-${attempt}"
            if curl -fsSL --connect-timeout 10 --max-time 20 "${PAGES_CSS}?janus_live=${nonce}" -o /tmp/live-neural-link-v2.css; then
              live_sha="$(sha256sum /tmp/live-neural-link-v2.css | awk '{print $1}')"
              if [ "$live_sha" = "$local_sha" ] \
                && grep -Fq '#view-console.neural-link-active.active{' /tmp/live-neural-link-v2.css \
                && ! grep -Fq '#view-console.neural-link-active{height:100%;min-height:0;overflow:hidden;display:flex' /tmp/live-neural-link-v2.css; then
                echo 'MOBILE_VIEW_OWNERSHIP=LIVE_CURRENT'
                echo "neural_link_css_sha256=$live_sha"
                exit 0
              fi
            fi
            sleep 5
          done
          echo 'MOBILE_VIEW_OWNERSHIP=STALE_OR_BROKEN' >&2
          exit 1
