name: JANUS Terminal v2.2 UI Contract

on:
  pull_request:
    paths:
      - 'index.html'
      - 'assets/terminal-v2.js'
      - 'assets/terminal-v2.css'
      - 'assets/neural-link-v2.js'
      - 'assets/neural-link-v2.css'
      - 'assets/adaptive-ui.js'
      - 'assets/adaptive-ui.css'
      - 'assets/janus-observatory.js'
      - 'assets/janus-observatory.css'
      - 'assets/janus-synthesis-observatory.js'
      - '.janus/TERMINAL_V2_HRAIN_MEMORY_CONTRACT.json'
      - 'tests/**'
      - 'tools/test-janus-observatory.js'
      - '.github/workflows/janus-terminal-v2.2-ui.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/terminal-v2.js'
      - 'assets/terminal-v2.css'
      - 'assets/neural-link-v2.js'
      - 'assets/neural-link-v2.css'
      - 'assets/adaptive-ui.js'
      - 'assets/adaptive-ui.css'
      - 'assets/janus-observatory.js'
      - 'assets/janus-observatory.css'
      - 'assets/janus-synthesis-observatory.js'
      - '.janus/TERMINAL_V2_HRAIN_MEMORY_CONTRACT.json'
      - 'tests/**'
      - 'tools/test-janus-observatory.js'
      - '.github/workflows/janus-terminal-v2.2-ui.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Validate Terminal v2.2 contract JSON
        run: python -m json.tool .janus/TERMINAL_V2_HRAIN_MEMORY_CONTRACT.json >/dev/null
      - name: Syntax-check browser runtimes
        run: |
          node --check assets/terminal-v2.js
          node --check assets/neural-link-v2.js
          node --check assets/adaptive-ui.js
          node --check assets/janus-observatory.js
          node --check assets/janus-synthesis-observatory.js
      - name: Run static architecture tests
        run: python -m pytest -q tests/test_terminal_v2_static.py
      - name: Run immutable organ-local verifier
        run: node tools/test-janus-observatory.js
      - name: Verify memory, Neural Link, adaptive UI and candidate boundaries
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          html = Path('index.html').read_text(encoding='utf-8')
          js = Path('assets/terminal-v2.js').read_text(encoding='utf-8')
          neural = Path('assets/neural-link-v2.js').read_text(encoding='utf-8')
          adaptive = Path('assets/adaptive-ui.js').read_text(encoding='utf-8')
          adaptive_css = Path('assets/adaptive-ui.css').read_text(encoding='utf-8')
          obs = Path('assets/janus-observatory.js').read_text(encoding='utf-8')
          c = json.loads(Path('.janus/TERMINAL_V2_HRAIN_MEMORY_CONTRACT.json').read_text())
          assert 'https://hawkar-usls.github.io/Hrain/memory.html' in js
          assert 'raw.githubusercontent.com/Hawkar-usls/janus-meta-registry' not in js
          assert 'raw.githubusercontent.com/Hawkar-usls/janus-meta-registry' not in neural
          assert 'raw.githubusercontent.com/Hawkar-usls/Hrain/main/state/neural-link/RECENT.json' in neural
          assert 'raw.githubusercontent.com/Hawkar-usls/Hrain/main/state/neural-link/PROVENANCE.json' in neural
          assert 'PUBLIC APPEND-ONLY MEMORY' in neural
          assert 'AWAITING GITHUB CONFIRMATION' in neural
          assert 'GITHUB_TOKEN' not in neural
          assert 'assets/adaptive-ui.css' in html
          assert 'assets/adaptive-ui.js' in html
          assert '100dvh' in adaptive_css
          assert 'safe-area-inset-bottom' in adaptive_css
          assert 'layout_only: true' in adaptive
          assert 'command_authority: false' in adaptive
          assert 'memory_authority: false' in adaptive
          assert 'transport_authority: false' in adaptive
          assert 'fetch(' not in adaptive
          assert 'raw.githubusercontent.com/Hawkar-usls/Janus-Demiurge/main/trump/TRUMP_MANIFEST.json' in js
          assert 'organism-trump-state' in html
          assert 'active brain eval loss' in html
          assert 'Rejected candidate != active brain' in obs
          assert c['memory_dataflow']['terminal_consumes_registry_directly'] is False
          assert c['neural_link_archive']['terminal_reads_archive_from_registry_directly'] is False
          assert c['neural_link_archive']['archive_grants_command_authority'] is False
          assert c['candidate_tissue_readout']['wake_allowed'] is True
          assert c['candidate_tissue_readout']['proof_authority'] is False
          assert c['candidate_tissue_readout']['P_VS_NP'] == 'OPEN'
          print('JANUS_TERMINAL_V22_ADAPTIVE_UI_CONTRACT_PASS')
          PY
