name: Sync Keymaster Automation Telemetry

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-keymaster-automation.yml'
      - 'assets/keymaster-automation.js'

permissions:
  contents: write

concurrency:
  group: terminal-keymaster-telemetry
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Fetch real Keymaster automation state
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import json
          import pathlib
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone

          HEADERS = {
              'Accept': 'application/vnd.github+json',
              'User-Agent': 'janus-terminal-keymaster-sync'
          }

          def fetch_json(url):
              req = urllib.request.Request(url, headers=HEADERS)
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          actions_url = 'https://api.github.com/repos/Hawkar-usls/Janus-Demiurge/actions/runs?branch=main&per_page=100'
          raw = fetch_json(actions_url)

          keys = (
              'id', 'name', 'display_title', 'path', 'event', 'status', 'conclusion',
              'created_at', 'updated_at', 'run_started_at', 'html_url', 'head_branch', 'head_sha'
          )

          runs = []
          for item in raw.get('workflow_runs', []):
              hay = ' '.join(str(item.get(k) or '') for k in ('name', 'display_title', 'path')).lower()
              if 'keymaster' in hay:
                  runs.append({k: item.get(k) for k in keys})

          semantic = None
          semantic_error = None
          try:
              path = 'janus_model/autonomous-keymaster/KEYMASTER_CANDIDATE_MATERIALIZATION_LATEST.json'
              ref = urllib.parse.urlencode({'ref': 'janus/autonomous-keymaster-lockpick'})
              meta_url = f'https://api.github.com/repos/Hawkar-usls/Janus-Demiurge/contents/{path}?{ref}'
              meta = fetch_json(meta_url)
              decoded = base64.b64decode(meta['content']).decode('utf-8')
              semantic = json.loads(decoded)
          except Exception as exc:
              semantic_error = f'{type(exc).__name__}: {exc}'

          data = {
              'schema': 'janus-keymaster-automation.v2',
              'generated_at': datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z'),
              'backend_repo': 'Hawkar-usls/Janus-Demiurge',
              'scheduler': {
                  'materializer': '13 * * * *',
                  'terminal_telemetry': '*/10 * * * *'
              },
              'source': 'github-actions-api+materializer-receipt',
              'materializer_semantic': semantic,
              'materializer_semantic_error': semantic_error,
              'workflow_runs': runs[:80]
          }

          target = pathlib.Path('data/keymaster-automation.json')
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(json.dumps(data, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(f'captured {len(runs)} Keymaster runs')
          print('semantic=' + (str(semantic.get('status')) if semantic else 'UNAVAILABLE'))
          if semantic_error:
              print('semantic_error=' + semantic_error)
          PY

      - name: Bind telemetry renderer into terminal
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          tag = '<script src="./assets/keymaster-automation.js?v=20260926-2" defer></script>'
          if 'assets/keymaster-automation.js' in text:
              import re
              text = re.sub(
                  r'<script\s+src=["\'][^"\']*assets/keymaster-automation\.js[^"\']*["\']\s+defer></script>',
                  tag,
                  text
              )
              p.write_text(text, encoding='utf-8')
              print('keymaster automation UI bound/refreshed')
          else:
              lines = text.splitlines()
              for i, line in enumerate(lines):
                  if 'assets/pnp-autoresearch-observatory.js' in line:
                      lines.insert(i + 1, tag)
                      break
              else:
                  raise SystemExit('pnp observatory script tag not found')
              p.write_text('\n'.join(lines) + '\n', encoding='utf-8')
              print('bound keymaster automation UI')
          PY

      - name: Persist telemetry heartbeat
        run: |
          set -euo pipefail
          git config user.name 'janus-terminal-telemetry[bot]'
          git config user.email 'janus-terminal-telemetry[bot]@users.noreply.github.com'
          git add data/keymaster-automation.json index.html
          if git diff --cached --quiet; then
            echo 'NO_STATE_CHANGE'
            exit 0
          fi
          git commit -m "Sync Keymaster automation telemetry"
          git push
