name: Sync Keymaster Automation Telemetry

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-keymaster-automation.yml'
      - 'assets/keymaster-automation.js'

permissions:
  contents: write

concurrency:
  group: terminal-keymaster-telemetry
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Fetch real Keymaster automation state
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import json
          import pathlib
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone

          HEADERS = {
              'Accept': 'application/vnd.github+json',
              'User-Agent': 'janus-terminal-keymaster-sync'
          }
          REPO_API = 'https://api.github.com/repos/Hawkar-usls/Janus-Demiurge'
          AUTONOMOUS_REF = 'janus/autonomous-keymaster-lockpick'

          def fetch_json(url):
              req = urllib.request.Request(url, headers=HEADERS)
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          def fetch_branch_json(path):
              ref = urllib.parse.urlencode({'ref': AUTONOMOUS_REF})
              meta = fetch_json(f'{REPO_API}/contents/{path}?{ref}')
              decoded = base64.b64decode(meta['content']).decode('utf-8')
              return json.loads(decoded)

          actions_url = f'{REPO_API}/actions/runs?branch=main&per_page=100'
          raw = fetch_json(actions_url)

          keys = (
              'id', 'name', 'display_title', 'path', 'event', 'status', 'conclusion',
              'created_at', 'updated_at', 'run_started_at', 'html_url', 'head_branch', 'head_sha'
          )

          runs = []
          for item in raw.get('workflow_runs', []):
              hay = ' '.join(str(item.get(k) or '') for k in ('name', 'display_title', 'path')).lower()
              if 'keymaster' in hay:
                  runs.append({k: item.get(k) for k in keys})

          semantic_paths = {
              'forge': 'janus_model/autonomous-keymaster/KEYMASTER_AUTONOMOUS_FORGE_LATEST.json',
              'materializer': 'janus_model/autonomous-keymaster/KEYMASTER_CANDIDATE_MATERIALIZATION_LATEST.json',
              'attack': 'janus_model/autonomous-keymaster/KEYMASTER_CANDIDATE_ATTACK_LATEST.json',
          }
          semantics = {}
          semantic_errors = {}
          for name, path in semantic_paths.items():
              try:
                  semantics[name] = fetch_branch_json(path)
                  semantic_errors[name] = None
              except Exception as exc:
                  semantics[name] = None
                  semantic_errors[name] = f'{type(exc).__name__}: {exc}'

          data = {
              'schema': 'janus-keymaster-automation.v3',
              'generated_at': datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z'),
              'backend_repo': 'Hawkar-usls/Janus-Demiurge',
              'autonomous_ref': AUTONOMOUS_REF,
              'scheduler': {
                  'forge': '43 * * * *',
                  'materializer': '13 * * * *',
                  'terminal_telemetry': '*/10 * * * *'
              },
              'source': 'github-actions-api+forge+materializer+attack-receipts',
              'forge_semantic': semantics['forge'],
              'materializer_semantic': semantics['materializer'],
              'attack_semantic': semantics['attack'],
              'semantic_errors': semantic_errors,
              'workflow_runs': runs[:80]
          }

          target = pathlib.Path('data/keymaster-automation.json')
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(json.dumps(data, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(f'captured {len(runs)} Keymaster runs')
          for name in ('forge', 'materializer', 'attack'):
              semantic = semantics[name]
              print(f'{name}=' + (str(semantic.get('status')) if semantic else 'UNAVAILABLE'))
              if semantic_errors[name]:
                  print(f'{name}_error=' + semantic_errors[name])
          PY

      - name: Bind telemetry renderer into terminal
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          tag = '<script src="./assets/keymaster-automation.js?v=20260927-1" defer></script>'
          if 'assets/keymaster-automation.js' in text:
              text = re.sub(
                  r'<script\s+src=["\'][^"\']*assets/keymaster-automation\.js[^"\']*["\']\s+defer></script>',
                  tag,
                  text
              )
              p.write_text(text, encoding='utf-8')
              print('keymaster automation UI bound/refreshed')
          else:
              lines = text.splitlines()
              for i, line in enumerate(lines):
                  if 'assets/pnp-autoresearch-observatory.js' in line:
                      lines.insert(i + 1, tag)
                      break
              else:
                  raise SystemExit('pnp observatory script tag not found')
              p.write_text('\n'.join(lines) + '\n', encoding='utf-8')
              print('bound keymaster automation UI')
          PY

      - name: Persist telemetry heartbeat
        run: |
          set -euo pipefail
          git config user.name 'janus-terminal-telemetry[bot]'
          git config user.email 'janus-terminal-telemetry[bot]@users.noreply.github.com'
          git add data/keymaster-automation.json index.html
          if git diff --cached --quiet; then
            echo 'NO_STATE_CHANGE'
            exit 0
          fi
          git commit -m "Sync Keymaster automation telemetry"
          git push
